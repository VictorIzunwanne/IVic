<div class="container">
  <header>
    <div class="sch-info">
      <button type="button" class="menu-btn" (click)="toggleMenu()">
        <img src="{{ menuIcon }}.svg" alt="hamburger menu" />
      </button>

      <h1 routerLink="/" (click)="closeMenu()" (click)="reloadPage()" tabindex="-1">
        ENEFEM <span class="none">GROUP OF </span> SCHOOLS
      </h1>

      <div class="space"></div>

      <button type="button" class="theme-btn" (click)="toggleTheme()">
        <img src="{{ thm }}.svg" alt="theme icon" />
      </button>
    </div>
  </header>

  <main>
    <div class="shadow" (click)="closeMenu()"></div>
    <div class="menu">
      <ul class="menu-list">
        <li class="heading"><p>Quick Links</p></li>

        <li routerLink="/" (click)="closeMenu()">
          <div class="menu-icon">
            <img src="dashboard.svg" alt="dashboard icon" height="20px" />
          </div>
          <p>Dashboard</p>
        </li>

        <li routerLink="/message" (click)="closeMenu()">
          <div class="menu-icon"><img src="message.svg" alt="message icon" height="20px" /></div>
          <p>Message</p>
        </li>

        <li class="heading"><p>Parents And Staffs</p></li>

        <li routerLink="/staff" (click)="closeMenu()">
          <div class="menu-icon"><img src="staff.svg" alt="staff icon" height="20px" /></div>
          <p>Staffs</p>
        </li>

        <li routerLink="/parent" (click)="closeMenu()">
          <div class="menu-icon"><img src="parent.svg" alt="parent icon" height="20px" /></div>
          <p>Parents</p>
        </li>

        <li class="heading"><p>Pupils</p></li>

        <li routerLink="/pupil" (click)="closeMenu()">
          <div class="menu-icon"><img src="pupil.svg" alt="pupil icon" height="20px" /></div>
          <p>Pupils</p>
        </li>

        <li routerLink="/class" (click)="closeMenu()">
          <div class="menu-icon"><img src="class.svg" alt="class icon" height="20px" /></div>
          <p>Class Mgt.</p>
        </li>

        <li routerLink="/record" (click)="closeMenu()">
          <div class="menu-icon"><img src="record.svg" alt="record icon" height="20px" /></div>
          <p>Records</p>
        </li>

        <li class="heading"><p>School</p></li>

        <li routerLink="/announcement" (click)="closeMenu()">
          <div class="menu-icon">
            <img src="announcement.svg" alt="announcement icon" height="20px" />
          </div>
          <p>Announcement</p>
        </li>

        <li routerLink="/about" (click)="closeMenu()">
          <div class="menu-icon"><img src="about.svg" alt="about icon" height="20px" /></div>
          <p>About School</p>
        </li>
      </ul>
    </div>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </main>

  <footer>
    <p>&copy;All Rights Reserved. ENEFEM GROUP OF SCHOOLS. 2026</p>
  </footer>
</div>
