<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Izunwanne Victor A.E" />
    <meta name="description" content="A simple calculator" />

    <title>A simple calculator</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="cont">
      <div class="display">
        <div class="sec-display"></div>
        <div class="pri-display"></div>
      </div>

      <div class="operators">
        <div class="operator-cont">
          <button type="button" class="operator esc">del</button>
          <button type="button" class="seven">7</button>
          <button type="button" class="four">4</button>
          <button type="button" class="one">1</button>
          <button type="button" class="point">.</button>
        </div>

        <div class="operator-cont">
          <button type="button" class="operator sign">+<br />_</button>
          <button type="button" class="eight">8</button>
          <button type="button" class="five">5</button>
          <button type="button" class="two">2</button>
          <button type="button" class="zero">0</button>
        </div>

        <div class="operator-cont">
          <button type="button" class="operator percent">%</button>
          <button type="button" class="nine">9</button>
          <button type="button" class="six">6</button>
          <button type="button" class="three">3</button>
          <button type="button" class="operator plus">+</button>
        </div>

        <div class="operator-cont">
          <button type="button" class="operator ac">AC</button>
          <button type="button" class="operator divide">/</button>
          <button type="button" class="operator multiply">x</button>
          <button type="button" class="operator minus">--</button>
          <button type="button" class="operator equalTo">=</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
