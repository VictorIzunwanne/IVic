<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Izunwanne Victor" />
    <meta
      name="description"
      content="A catalogue of some disney characters designed by ...., built by Izunwanne Victor"
    />

    <title>Disney Characters</title>

    <link
      rel="shortcut icon"
      href="media/disney-favicon.png"
      type="image/x-icon"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    />

    <link rel="stylesheet" href="styles.css" />

  <body>
    <header>
      <div class="lg">
        <img src="media/disney.png" alt="disney logo" height="50px" />

        <p>Characters</p>
      </div>

      <div class="srch">
        <div class="srchbar">
          <img src="media/search-icon.png" alt="search icon" height="20px" />

          <input type="text" placeholder="Search chararcters" />
        </div>
      </div>

      <div class="menu">
        <p>Menu</p>

        <img src="media/menu-icon.png" alt="menu icon" height="15px" />
      </div>
    </header>

    <main>
      <div class="one">
        <div class="cont">
          <div class="char rosetta">
            <div class="char-img">
              <img src="media/rosetta.png" alt="rosetta image" height="300px" />
            </div>

            <div class="char-d">
              <div class="char-name">
                <p>Rosetta</p>
              </div>

              <div class="mov-name">
                <p><span>Movie</span> Tinkerbell</p>
              </div>

              <div class="more">Read More</div>
            </div>
          </div>
        </div>

        <div class="cont">
          <div class="char sadness">
            <div class="char-img">
              <img src="media/sadness.png" alt="sadness image" height="300px" />
            </div>

            <div class="char-d">
              <div class="char-name">
                <p>Sadness</p>
              </div>

              <div class="mov-name">
                <p><span>Movie</span> Inside Out</p>
              </div>

              <div class="more">Read More</div>
            </div>
          </div>
        </div>

        <div class="cont">
          <div class="char disgust">
            <div class="char-img">
              <img src="media/disgust.png" alt="disgust image" height="300px" />
            </div>

            <div class="char-d">
              <div class="char-name">
                <p>Disgust</p>
              </div>

              <div class="mov-name">
                <p><span>Movie</span> Inside Out</p>
              </div>

              <div class="more">Read More</div>
            </div>
          </div>
        </div>
      </div>

      <div class="two">
        <div class="cont">
          <div class="char judy">
            <div class="char-img">
              <img src="media/judy.png" alt="judy image" height="300px" />
            </div>

            <div class="char-d">
              <div class="char-name">
                <p>Judy</p>
              </div>

              <div class="mov-name">
                <p><span>Movie</span> Zootopia</p>
              </div>

              <div class="more">Read More</div>
            </div>
          </div>
        </div>

        <div class="cont">
          <div class="char moana">
            <div class="char-img">
              <img src="media/moana.png" alt="moana image" height="300px" />
            </div>

            <div class="char-d">
              <div class="char-name">
                <p>Moana</p>
              </div>

              <div class="mov-name">
                <p><span>Movie</span> Moana</p>
              </div>

              <div class="more">Read More</div>
            </div>
          </div>
        </div>

        <div class="cont">
          <div class="char vanellope">
            <div class="char-img">
              <img
                src="media/vanellope.png"
                alt="vanellope image"
                height="300px"
              />
            </div>

            <div class="char-d">
              <div class="char-name">
                <p>Vanellope</p>
              </div>

              <div class="mov-name">
                <p><span>Movie</span> Wreck-It Ralph</p>
              </div>

              <div class="more">Read More</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="socials">
        <a href="x.com" target="blank">Twitter</a>

        <a href="https://wa.me/+2348149322166" target="blank">Whatsapp</a>
      </div>

      <div class="nav">
        <div class="prev">
          <img src="media/arrow.svg" alt="previous icon" height="20px" />

          <p>Prev</p>
        </div>

        <div class="next">
          <p>Next</p>

          <img src="media/arrow.svg" alt="next icon" height="20px" />
        </div>
      </div>
    </footer>

    <script src="script.js" defer></script>

</html>
